[project]
name = "lab01-ml-basics"
version = "1.0.0"
description = "Lab 1: mathematical foundations of machine learning"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=no -q"
